name: Security Snyk dependency check

on:
  workflow_dispatch: 
  schedule:
    - cron: "19 6 * * MON-FRI"  

jobs:
  security-snyk-check:
    permissions:
      contents: read
      actions: read
      id-token: write
      security-events: write
    name: Project security Snyk dependency check
    uses: ministryofjustice/hmpps-github-actions/.github/workflows/security_snyk_scan_ecr.yml@v2
    with:
      channel_id: ${{ vars.SECURITY_ALERTS_SLACK_CHANNEL_ID || 'NO_SLACK' }}
      subproject: ''
      severity: 'HIGH,CRITICAL'
      scan_type: 'image' # or 'fs'
      location: '.'
      image_ref: '${{ vars.CLOUD_PLATFORM_ECR_REGISTRY_URL }}/${{ vars.ECR_REPOSITORY }}:latest'
      slack_include_summary: true
      snyk_policy_path: '' # Optional path to a custom Snyk policy file
    secrets:
      HMPPS_SNYK_CLIENT_SECRET: ${{ secrets.HMPPS_SNYK_CLIENT_SECRET }}
      HMPPS_SNYK_CLIENT_ID: ${{ secrets.HMPPS_SNYK_CLIENT_ID }}
      HMPPS_SRE_SLACK_BOT_TOKEN: ${{ secrets.HMPPS_SRE_SLACK_BOT_TOKEN }}
      ECR_ROLE_TO_ASSUME: ${{ secrets.ECR_ROLE_TO_ASSUME }}