---
# Per environment values which override defaults in hmpps-template-typescript/values.yaml

generic-service:
  ingress:
    host: template-typescript.hmpps.service.justice.gov.uk

  env:
    INGRESS_URL: "https://template-typescript.hmpps.service.justice.gov.uk"
    HMPPS_AUTH_URL: "https://sign-in.hmpps.service.justice.gov.uk/auth"
    TOKEN_VERIFICATION_API_URL: "https://token-verification-api.prison.service.justice.gov.uk"
    EXAMPLE_API_URL: 'https://template-kotlin.hmpps.service.justice.gov.uk'
    AUDIT_ENABLED: "false"

  allowlist:
    # remove groups as appropriate to give the minimum ingress access required:
    #   digital_staff_and_mojo: devices on the MoJ network
    #   moj_cloud_platform: services on Cloud Platform
    groups:
      - digital_staff_and_mojo
      - moj_cloud_platform


generic-prometheus-alerts:
  alertSeverity: PROD_ALERTS_SEVERITY_LABEL
