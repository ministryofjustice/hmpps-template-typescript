---
# Per environment values which override defaults in hmpps-template-typescript/values.yaml

generic-service:
  replicaCount: 2

  ingress:
    host: template-typescript-preprod.hmpps.service.justice.gov.uk
    # modsecurity_enabled: true
    # modsecurity_github_team: '<YOUR TEAM>'
    # modsecurity_snippet: |
    #   SecAuditEngine On
    #   SecRuleEngine DetectionOnly
    #   SecDefaultAction 'phase:2,pass,log,tag:github_team=<YOUR TEAM>,tag:namespace={{ .Release.Namespace }}''


  env:
    INGRESS_URL: "https://template-typescript-preprod.hmpps.service.justice.gov.uk"
    HMPPS_AUTH_URL: "https://sign-in-preprod.hmpps.service.justice.gov.uk/auth"
    TOKEN_VERIFICATION_API_URL: "https://token-verification-api-preprod.prison.service.justice.gov.uk"
    EXAMPLE_API_URL: 'https://template-kotlin-preprod.hmpps.service.justice.gov.uk'
    ENVIRONMENT_NAME: PRE-PRODUCTION
    AUDIT_ENABLED: "false"

generic-prometheus-alerts:
  alertSeverity: NON_PROD_ALERTS_SEVERITY_LABEL
