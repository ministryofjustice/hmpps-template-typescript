generic-service:
  nameOverride: hmpps-template-typescript
  productId: 'UNASSIGNED' # productId for the product that this belongs too, i.e. DPS001, see README.md for details

  # the IRSA service account name for accessing AWS resources
  # serviceAccountName: "hmpps-template-typescript"

  replicaCount: 4

  image:
    repository: ghcr.io/ministryofjustice/hmpps-template-typescript
    tag: app_version # override at deployment time
    port: 3000

  ingress:
    enabled: true
    host: app-hostname.local # override per environment
    tlsSecretName: hmpps-template-typescript-cert

  livenessProbe:
    httpGet:
      path: /ping

  readinessProbe:
    httpGet:
      path: /ping

  # Environment variables to load into the deployment
  env:
    NODE_ENV: 'production'
    REDIS_ENABLED: 'true'
    REDIS_TLS_ENABLED: 'true'
    TOKEN_VERIFICATION_ENABLED: 'true'
    AUDIT_SQS_REGION: 'eu-west-2'
    AUDIT_SERVICE_NAME: 'UNASSIGNED' # Your audit service name
    NODE_USE_ENV_PROXY: '1' # Enable proxy support for Node.js HTTP clients
    APPLICATION_INSIGHTS_NO_STATSBEAT: 'true' # Disable Application Insights statsbeat telemetry

  # Pre-existing kubernetes secrets to load as environment variables in the deployment.
  # namespace_secrets:
  #   [name of kubernetes secret]:
  #     [name of environment variable as seen by app]: [key of kubernetes secret to load]

  namespace_secrets:
    # These secrets are created by terraform.
    hmpps-template-typescript-client-creds:
      CLIENT_CREDS_CLIENT_ID: 'CLIENT_CREDS_CLIENT_ID'
      CLIENT_CREDS_CLIENT_SECRET: 'CLIENT_CREDS_CLIENT_SECRET'
    hmpps-template-typescript-auth-code:
      AUTH_CODE_CLIENT_ID: 'AUTH_CODE_CLIENT_ID'
      AUTH_CODE_CLIENT_SECRET: 'AUTH_CODE_CLIENT_SECRET'    
    hmpps-template-typescript-session-secret:
      SESSION_SECRET: 'SESSION_SECRET'
    hmpps-template-typescript-elasticache-redis:
      REDIS_HOST: 'primary_endpoint_address'
      REDIS_AUTH_TOKEN: 'auth_token'
    hmpps-template-typescript-application-insights:
      APPLICATIONINSIGHTS_CONNECTION_STRING: "APPLICATIONINSIGHTS_CONNECTION_STRING"
    # Uncomment the section below when your namespace has egress controls deployed.
    # This is required for services to route outbound HTTPS traffic through the Envoy proxy.
    # See: https://tech-docs.hmpps.service.justice.gov.uk/service-standard/egress-controls
    # hmpps-envoy-https-proxy-env:
    #   HTTP_PROXY: "HTTP_PROXY"
    #   HTTPS_PROXY: "HTTPS_PROXY"
    #   NO_PROXY: "NO_PROXY"
    #   http_proxy: "HTTP_PROXY"
    #   https_proxy: "HTTPS_PROXY"
    #   no_proxy: "NO_PROXY"
    # This secret will need to be created in your namespace (note it isn't in hmpps-templates-dev)
    # IRSA configuration in your namespace will also be required, and then uncomment serviceAccountName above.
    # sqs-hmpps-audit-secret:
    #   AUDIT_SQS_QUEUE_URL: 'sqs_queue_url'

  allowlist:
    groups:
      - internal

generic-prometheus-alerts:
  targetApplication: hmpps-template-typescript
